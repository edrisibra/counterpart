[project]
name = "a2a-sandbox"
version = "0.0.1"
description = "Test your A2A agent against simulated counterparties — cooperative, broken, or hostile — before you connect it to a real one."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "a2a-sandbox contributors" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["a2a", "agent2agent", "testing", "mock", "adversarial", "agents", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing :: Mocking",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "starlette>=0.37",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
a2a-sandbox = "a2a_sandbox.cli.main:app"

[project.entry-points.pytest11]
a2a_sandbox = "a2a_sandbox.pytest_plugin.plugin"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_sandbox"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "C4",    # comprehensions
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls (blocking calls in async code)
    "T20",   # no stray print (CLI modules opt out)
]

[tool.ruff.lint.per-file-ignores]
"src/a2a_sandbox/cli/**" = ["T20"]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["a2a_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
