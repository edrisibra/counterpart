[project]
name = "counterpart-scanner"
version = "0.1.0"
description = "Hosted A2A agent scanner built on counterpart. Not published to PyPI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["counterpart>=0.1.16", "starlette>=0.37", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.15", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterpart_scanner"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
